<article class="card"><span class="badge">Active</span><h3>Prime administrator</h3>
  <p class="muted">Signed in as <strong>{{USERNAME}}</strong> ({{ROLE}}). Password changes are saved securely.</p>{{NOTICE}}
  <form method="post" action="/password"><div class="field-grid">
    <label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label>
    <label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label>
  </div><p><button class="button" type="submit">Change password</button></p></form>
</article>

<article class="card preference-card" id="date-of-birth-settings">
  <span class="badge">Profile</span><h3>Date of birth</h3>
  <form id="age-content-form">
    <div class="field-grid">
      <label>Date of birth
        <input id="age-birth-date" name="birth_date" type="date" autocomplete="bday" required>
      </label>
    </div>
    <p><button id="age-content-save" class="button" type="submit">Save date of birth</button></p>
  </form>
  <p class="preference-feedback muted" id="age-content-feedback" aria-live="polite"></p>
</article>

<article class="card"><span class="badge">Alpha preview</span><h3>Debrid accounts</h3><p class="muted">Real-Debrid, AllDebrid, Premiumize, and TorBox connections will be added later.</p></article>

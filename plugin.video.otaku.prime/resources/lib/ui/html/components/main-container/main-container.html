<div class="main-container">
  <header class="topbar"><div class="brand-row">
    <div class="brand"><span class="brand-mark">OP</span><div><h1>Otaku Prime</h1><p>Management interface</p></div></div>
    <label class="topbar-search" for="prime-search"><span class="visually-hidden">Search current view</span><input id="prime-search" type="search" placeholder="Search" autocomplete="off" disabled></label>
    <div><span class="user-name">{{USERNAME}} &nbsp;</span><a class="button secondary" href="/logout">Sign out</a></div>
  </div><nav class="tabs" role="tablist" aria-label="Settings categories">{{TABS}}</nav></header>
  <main class="main-content"><div class="content-inner">{{PANELS}}</div></main>
  <footer class="bottombar"><span>Otaku Prime 0.1.2 Alpha11</span><span class="bottom-actions"><span>Administration interface</span><button class="log-toggle" id="log-toggle" type="button" aria-controls="app-log-window" aria-expanded="false">App logs</button></span></footer>
</div>
<aside class="app-log-window" id="app-log-window" aria-label="Application logs" aria-hidden="true">
  <header><div><strong>App logs</strong><span id="app-log-state">Live updates paused</span></div><button id="app-log-close" type="button" aria-label="Close logs">×</button></header>
  <div class="app-log-messages" id="app-log-messages" role="log" aria-live="polite"></div>
</aside>
<link rel="stylesheet" href="/ui/components/app-logs/app-logs.css">
<script src="/ui/components/app-logs/app-logs.js" defer></script>

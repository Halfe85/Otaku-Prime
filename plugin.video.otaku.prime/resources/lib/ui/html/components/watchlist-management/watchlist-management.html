<link rel="stylesheet" href="/ui/components/watchlist-management/watchlist-library-state.css">
<section class="watchlist-tools" aria-label="Watchlist filters">
  <label>List status<select id="watchlist-status"><option value="">All statuses</option><option value="CURRENT">Watching</option><option value="COMPLETED">Completed</option><option value="PAUSED">Paused</option><option value="DROPPED">Dropped</option><option value="PLANNING">Planning</option></select></label>
</section>
<p class="notice" id="watchlist-message" hidden></p>
<div class="watchlist-table-wrap">
  <table class="watchlist-table"><thead><tr><th>Title</th><th>Providers</th><th>Format</th><th>Prime status</th><th>Progress</th></tr></thead><tbody id="watchlist-rows"><tr><td colspan="5" class="muted">Loading watchlist…</td></tr></tbody></table>
</div>
<nav class="watchlist-pagination" id="watchlist-pagination" aria-label="Watchlist pages">
  <button class="button secondary" id="watchlist-previous" type="button">Previous</button>
  <span id="watchlist-page-status">Page 1 of 1</span>
  <button class="button secondary" id="watchlist-next" type="button">Next</button>
</nav>

<div class="series-modal" id="series-modal" hidden>
  <div class="series-modal-backdrop" data-modal-close></div>
  <section class="series-modal-card" role="dialog" aria-modal="true" aria-labelledby="series-modal-title">
    <header class="series-modal-header">
      <div><h2 id="series-modal-title">Series details</h2></div>
      <button class="series-modal-close" type="button" data-modal-close aria-label="Close series details">&times;</button>
    </header>

    <div class="series-modal-body">
      <section class="series-state-card">
        <div><span>Prime status</span><strong id="series-modal-status">—</strong></div>
        <div><span>Progress</span><button class="series-progress-button" id="series-modal-progress" type="button" aria-label="Edit progress">—</button></div>
        <div><span>Format</span><strong id="series-modal-format">—</strong></div>
        <div><span>First release</span><strong id="series-modal-release">—</strong></div>
      </section>

      <p class="series-conflict" id="series-modal-conflict" hidden>
        A connected provider disagrees with Prime. Prime's status and progress remain authoritative.
      </p>
      <p class="series-conflict" id="series-modal-identity-conflict" hidden></p>

      <section class="series-detail-section">
        <h3>Titles</h3>
        <dl class="series-detail-list series-title-list">
          <div><dt>English</dt><dd id="series-modal-english">—</dd></div>
          <div><dt>Romaji</dt><dd id="series-modal-romaji">—</dd></div>
          <div><dt>Native</dt><dd id="series-modal-native">—</dd></div>
        </dl>
      </section>

      <section class="series-detail-section">
        <h3>Provider identities</h3>
        <div class="provider-link-list" id="series-modal-provider-links"></div>
      </section>
    </div>

    <footer class="series-modal-footer">
      <span id="series-modal-local-id" class="series-local-id"></span>
      <button class="button secondary" type="button" data-modal-close>Close</button>
    </footer>
  </section>
</div>
<script src="/ui/components/watchlist-management/watchlist-library-state.js" defer></script>

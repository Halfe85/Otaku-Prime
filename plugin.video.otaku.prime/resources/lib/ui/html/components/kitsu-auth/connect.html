<div class="status">Not connected</div>
<form method="post" action="/watchlist/kitsu/connect" class="credentials-form">
  <label>Kitsu username or email<input name="username" autocomplete="username" required autofocus></label>
  <label>Kitsu password<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit" class="button">Connect Kitsu</button>
</form>

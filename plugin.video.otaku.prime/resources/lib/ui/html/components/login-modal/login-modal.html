<main class="auth-screen"><div class="modal-backdrop"><section class="auth-modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <div class="brand"><span class="brand-mark">OP</span><div><h1>Otaku Prime</h1><p>Local management</p></div></div>
  <h2 id="login-title">Welcome back</h2><p class="muted">Sign in to manage this Otaku Prime installation.</p>{{NOTICE}}
  <form method="post" action="/login">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button" type="submit">Sign in</button>
  </form>
</section></div></main>
